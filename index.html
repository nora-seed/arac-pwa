<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="Araçlarınızın yakıt, bakım, masraf ve belgelerini cihazınızda takip eden çevrimdışı PWA.">
<title>Araç Takip — Garajım</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Araç Takip">
<link rel="stylesheet" href="style.css">
<script>
(function () {
  try {
    var raw = localStorage.getItem("aracTakip.v1");
    var state = raw ? JSON.parse(raw) : null;
    var pref = (state && state.settings && state.settings.theme) || "auto";
    var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5V13l1.6-4.2A2.2 2.2 0 0 1 8.7 7.4h6.6a2.2 2.2 0 0 1 2.1 1.4L19 13v3.5"/><path d="M4.5 13h15"/><path d="M7 16.5h.01M17 16.5h.01"/><circle cx="7.5" cy="17.6" r="1.7"/><circle cx="16.5" cy="17.6" r="1.7"/></svg>
      </span>
      <div class="brand-text">
        <h1>Araç Takip</h1>
        <p id="topDate">—</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Tema değiştir" title="Tema değiştir">◐</button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Ayarlar" title="Ayarlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.96 4.6H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="vehicle-bar" id="vehicleBar">
    <select id="vehicleSelect" class="vehicle-picker" aria-label="Aktif araç"></select>
    <button id="addVehicleBtn" class="btn small ghost" type="button">+ Araç</button>
  </div>
</header>

<main id="view" class="view" tabindex="-1" aria-live="polite"></main>

<button class="fab-float" id="fab" type="button" aria-label="Yeni kayıt ekle" title="Yeni kayıt ekle">+</button>

<nav class="tabbar" aria-label="Ana sekmeler">
  <a class="tab" href="#panel" data-nav="panel"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></span><span>Panel</span></a>
  <a class="tab" href="#yakit" data-nav="yakit"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16"/><path d="M4 21h13"/><path d="M8 8h5"/><path d="M15 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-2-3"/></svg></span><span>Yakıt</span></a>
  <a class="tab" href="#bakim" data-nav="bakim"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-5.9 5.9L3 18v3h3l5.8-5.8a4.5 4.5 0 0 0 5.9-5.9l-2.6 2.6-2.5-2.5z"/></svg></span><span>Bakım</span></a>
  <a class="tab" href="#masraf" data-nav="masraf"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg></span><span>Masraf</span></a>
  <a class="tab" href="#belgeler" data-nav="belgeler"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></span><span>Belgeler</span></a>
</nav>

<div class="overlay hidden" id="overlay">
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </section>
</div>

<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="logic.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
